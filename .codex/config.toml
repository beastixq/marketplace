# Project Codex CLI defaults. AGENTS.md is the canonical WebLabs 2026 AI-track
# context; these settings and specialist agents do not define lab completion.

model = "gpt-5.6-sol"
project_doc_max_bytes = 65536

# Safer default for local coding.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Codex web search:
# "cached" = safer, OpenAI-maintained search cache.
# "live" = fresher, higher prompt-injection exposure.
# "disabled" = no web search.
web_search = "live"

[mcp_servers.chrome_devtools]
# Browser tooling for later browser checks; npx here is not an application
# frontend dependency. The current application remains a Go-rendered MPA.
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@latest",
    "--slim",
    "--headless",
    "--isolated",
    "--executablePath=/usr/bin/google-chrome-stable",
    "--no-usage-statistics",
]
env = { npm_config_cache = "/tmp/npm-cache" }
startup_timeout_sec = 20
tool_timeout_sec = 45
enabled = true

[sandbox_workspace_write]
# Lets shell commands such as npm/pnpm/pip/curl reach the internet.
# This is separate from Codex's web search tool.
network_access = true

[features]
multi_agent = true
hooks = true
skill_mcp_dependency_install = true

[agents]
enabled = true
max_concurrent_threads_per_session = 6
