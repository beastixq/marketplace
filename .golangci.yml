run:
  timeout: 5m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - contextcheck
    - sqlclosecheck
    - rowserrcheck
    - gosec
    - misspell

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
