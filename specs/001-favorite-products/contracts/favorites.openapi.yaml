openapi: 3.0.3
info:
  title: Favorite Products API
  version: 0.1.0
  description: Backend-only JSON API contract for product favorites.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /favorites:
    get:
      summary: List favorite products for the current actor
      description: Returns active visible products favorited by the authenticated actor.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Favorite products for the current actor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /favorites/{productID}:
    put:
      summary: Mark a product as favorite for the current actor
      description: Idempotent. Creates the favorite relationship if absent; a repeat call is a no-op.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      responses:
        '201':
          description: Favorite relationship created.
        '200':
          description: Product was already favorited by this actor.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Product exists but is not active and visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Remove a product favorite for the current actor
      description: Idempotent. Always returns 204 whether the favorite was present or absent.
      parameters:
        - $ref: '#/components/parameters/ProductID'
      responses:
        '204':
          description: Favorite relationship absent after the request.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Check whether a product is favorite for the current actor
      parameters:
        - $ref: '#/components/parameters/ProductID'
      responses:
        '200':
          description: Current actor favorite state for the product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Product exists but is not active and visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductID:
      name: productID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
  schemas:
    Product:
      type: object
      required: [id, seller_id, name, price, created_at]
      properties:
        id:
          type: integer
          format: int64
        seller_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: string
          description: Decimal monetary value serialized by the existing product DTO.
        created_at:
          type: string
          format: date-time
    FavoriteState:
      type: object
      required: [product_id, is_favorite]
      properties:
        product_id:
          type: integer
          format: int64
        is_favorite:
          type: boolean
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid path, query, or request input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Product not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected internal failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
