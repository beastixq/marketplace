services:
  db:
    ports: !reset []
    volumes:
      - ${STAND_PATH:?STAND_PATH required}/postgres:/var/lib/postgresql/data
  cache:
    ports: !reset []
  api:
    image: marketplace-test-runner:lab2
    entrypoint: []
    command: ["/stand/marketplace-api", "-config", "/stand/config.yaml"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/marketplace?sslmode=disable
    volumes:
      - ${STAND_PATH:?STAND_PATH required}:/stand:ro
    ports:
      - "127.0.0.1:${UI_PORT:-0}:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
  runner:
    image: marketplace-test-runner:lab2
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/marketplace?sslmode=disable
      BASE_URL: http://api:8080
      RUN_ID: ${RUN_ID:?RUN_ID required}
      TEST_COMMIT_SHA: ${TEST_COMMIT_SHA:-working-copy}
      TEST_REPOSITORY_URL: ${TEST_REPOSITORY_URL:-}
      TEST_FAULT: ${TEST_FAULT:-}
      TEST_FAULT_GATE: ${TEST_FAULT_GATE:-}
      CI: ${CI:-}
    volumes:
      - ${RUN_PATH:?RUN_PATH required}:/run
      - ${RUN_PATH:?RUN_PATH required}/workspace:/workspace
      - ${STAND_PATH:?STAND_PATH required}:/stand
      - ${CACHE_PATH:?CACHE_PATH required}/mod:/go/pkg/mod
      - ${CACHE_PATH:?CACHE_PATH required}/build:/root/.cache/go-build
    tmpfs:
      - /tmp:size=2147483648,exec
    cap_add: [NET_RAW, NET_ADMIN]
