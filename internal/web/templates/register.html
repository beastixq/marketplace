{{define "title"}}Register{{end}}

{{define "content"}}
<div class="auth-container">
    <h1>Register</h1>
    {{if .Error}}
    <div class="alert alert--error">{{.Error}}</div>
    {{end}}
    <form method="POST" action="/register">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{.Email}}" required>
        </div>
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{.FullName}}" placeholder="Ivan Petrov" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone (optional)</label>
            <input type="tel" id="phone" name="phone" value="{{.Phone}}" placeholder="+79991234567">
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
                <option value="buyer" {{if eq .Role "buyer"}}selected{{end}}>Buyer</option>
                <option value="seller" {{if eq .Role "seller"}}selected{{end}}>Seller</option>
            </select>
        </div>
        <button type="submit" class="btn btn--primary">Register</button>
    </form>
    <div class="auth-link">
        Already have an account? <a href="/login">Login</a>
    </div>
</div>
{{end}}
