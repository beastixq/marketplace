{{define "title"}}Edit Product{{end}}

{{define "content"}}
<h1 style="margin-bottom: 1.5rem;">Edit Product</h1>

{{if .Error}}
<div class="alert alert--error">{{.Error}}</div>
{{end}}

<div class="form-card">
    <form method="POST" action="/seller/products/{{.Product.ID}}/edit">
        <div class="form-group">
            <label for="name">Product Name</label>
            <input type="text" id="name" name="name" required value="{{.Product.Name}}">
        </div>
        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea id="description" name="description" rows="3"
                      style="width:100%;padding:0.6rem 0.75rem;border:1px solid var(--border);border-radius:4px;font-size:0.9rem;font-family:inherit;">{{with .Product.Description}}{{.}}{{end}}</textarea>
        </div>
        <div class="form-group">
            <label for="price">Price (RUB)</label>
            <input type="number" id="price" name="price" required min="0.01" step="0.01" value="{{.Product.Price}}">
        </div>
        <div class="form-group">
            <label for="stock_quantity">Stock Quantity</label>
            <input type="number" id="stock_quantity" name="stock_quantity" required min="0" value="{{.Product.StockQuantity}}">
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button type="submit" class="btn btn--primary">Save Changes</button>
            <a href="/seller" class="btn" style="background: var(--border); color: var(--text);">Cancel</a>
        </div>
    </form>
</div>
{{end}}
