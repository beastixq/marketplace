# Marketplace configuration.
# Secrets (database.dsn, auth.jwt_secret) can be overridden by env vars
# DATABASE_URL and JWT_SECRET respectively. The env var wins when set.

server:
  addr: ":8080"

database:
  # Switch with DATABASE_TYPE=postgres|mongo.
  type: "mongo"
  # Local dev default. Override via DATABASE_URL in prod.
  dsn: "postgres://postgres:postgres@localhost:5432/marketplace?sslmode=disable"
  mongo:
    # Used when database.type is "mongo". Override URI via MONGODB_URI.
    uri: "mongodb://localhost:27017/?replicaSet=rs0"
    name: "marketplace"

redis:
  enabled: true
  addr: "localhost:6379"
  password: ""
  db: 0
  dial_timeout: "2s"
  product_ttl: "5m"

auth:
  jwt_secret: "dev-secret-change-me"
  jwt_ttl: "24h"
  bcrypt_cost: 10

payment:
  ttl: "2m"
  gateway_url: "http://localhost:8080"

orders:
  expiration_check_interval: "1m"

logging:
  level: "info" # debug | info | warn | error
  format: "json" # json | text
  file: "logs/marketplace.log" # empty disables file sink
  console: true # mirror to stdout
  add_source: false # include source file:line
