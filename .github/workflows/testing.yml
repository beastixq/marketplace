name: Marketplace tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
  TEST_COMMIT_SHA: ${{ github.sha }}
  TEST_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
  TEST_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-tests
        with:
          stage: unit

  integration:
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-tests
        with:
          stage: integration

  e2e:
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-tests
        with:
          stage: e2e

  report:
    needs: [unit, integration, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      public-report: ${{ steps.allure.outputs.available }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/allure-report
        id: allure
        with:
          jobs: ${{ toJSON(needs) }}
      - name: Upload sanitized Allure site
        if: always() && steps.allure.outputs.available == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/lab2/${{ env.RUN_ID }}/public-allure-report/

  publish-report:
    needs: report
    if: always() && needs.report.outputs.public-report == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-reports
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish sanitized Allure
        id: deployment
        uses: actions/deploy-pages@v4
