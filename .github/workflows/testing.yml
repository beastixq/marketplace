name: Testing

on:
  push:
    branches: [TAD-Lab2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      public-report: ${{ steps.report.outputs.available }}
    env:
      RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      STAND_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
      TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify branch history
        id: history
        shell: bash
        run: |
          key=$(printf '%s' "$TEST_BRANCH" | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "directory=artifacts/lab2/history/$key" >> "$GITHUB_OUTPUT"
      - name: Download previous history using the job token
        uses: actions/github-script@v7
        env:
          HISTORY_KEY: ${{ steps.history.outputs.key }}
          HISTORY_DIRECTORY: ${{ steps.history.outputs.directory }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const name = `lab2-history-${process.env.HISTORY_KEY}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100});
            const previous = artifacts.filter(a => !a.expired && a.workflow_run?.id !== context.runId)
              .sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
            if (!previous) { core.info('First run: no previous history'); return; }
            const archive = await github.rest.actions.downloadArtifact({owner: context.repo.owner,
              repo: context.repo.repo, artifact_id: previous.id, archive_format: 'zip'});
            fs.mkdirSync(process.env.HISTORY_DIRECTORY, {recursive: true});
            const filename = path.join(process.env.RUNNER_TEMP, 'allure-history.zip');
            fs.writeFileSync(filename, Buffer.from(archive.data));
            await exec.exec('unzip', ['-q', filename, '-d', process.env.HISTORY_DIRECTORY]);
      - name: Unit, integration, E2E and recovery
        run: make test-all
      - name: Explain stages and report access
        id: report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const root = `artifacts/lab2/${process.env.RUN_ID}`;
            const statuses = fs.existsSync(`${root}/stages.json`)
              ? JSON.parse(fs.readFileSync(`${root}/stages.json`, 'utf8')) : {};
            const rows = ['unit', 'integration', 'e2e'].map(name => [name, statuses[name] || 'not started']);
            const recovery = fs.existsSync(`${root}/recovery.json`)
              ? JSON.parse(fs.readFileSync(`${root}/recovery.json`, 'utf8')) : null;
            rows.push(['recovery', recovery ? (recovery.restored ? 'passed' : 'incomplete') : 'not started']);
            const available = fs.existsSync(`${root}/public-allure-report/index.html`);
            core.setOutput('available', String(available));
            await core.summary.addHeading('Marketplace: unit → integration → E2E')
              .addRaw('One hosted runner keeps the same Docker stand through all stages and recovery.\n\n')
              .addTable([[{data: 'Stage', header: true}, {data: 'Result', header: true}], ...rows])
              .addRaw('Full diagnostics and coverage: download the testing artifact below.\n\n')
              .addLink('Public Allure (updated by the deployment job)', `https://${context.repo.owner}.github.io/${context.repo.repo}/`)
              .write();
      - name: Preserve reports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/lab2/${{ env.RUN_ID }}/
            !artifacts/lab2/${{ env.RUN_ID }}/baseline.dump
            !artifacts/lab2/${{ env.RUN_ID }}/baseline.sql
            !artifacts/lab2/${{ env.RUN_ID }}/restored.sql
      - name: Preserve branch history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-history-${{ steps.history.outputs.key }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ steps.history.outputs.directory }}/
      - name: Upload sanitized Allure site
        if: always() && steps.report.outputs.available == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/TAD-Lab2'
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/lab2/${{ env.RUN_ID }}/public-allure-report/

  publish-report:
    needs: test
    if: always() && needs.test.outputs.public-report == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/TAD-Lab2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish sanitized Allure
        id: deployment
        uses: actions/deploy-pages@v4
