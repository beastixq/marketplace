name: Testing

on:
  push:
    branches: [TAD-Lab2]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testing-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      STAND_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
      TEST_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify branch history
        id: history
        shell: bash
        run: |
          key=$(printf '%s' "$TEST_BRANCH" | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "directory=artifacts/lab2/history/$key" >> "$GITHUB_OUTPUT"
      - name: Download previous history using the job token
        uses: actions/github-script@v7
        env:
          HISTORY_KEY: ${{ steps.history.outputs.key }}
          HISTORY_DIRECTORY: ${{ steps.history.outputs.directory }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const name = `lab2-history-${process.env.HISTORY_KEY}`;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              {owner: context.repo.owner, repo: context.repo.repo, name, per_page: 100});
            const previous = artifacts.filter(a => !a.expired && a.workflow_run?.id !== context.runId)
              .sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
            if (!previous) { core.info('First run: no previous history'); return; }
            const archive = await github.rest.actions.downloadArtifact({owner: context.repo.owner,
              repo: context.repo.repo, artifact_id: previous.id, archive_format: 'zip'});
            fs.mkdirSync(process.env.HISTORY_DIRECTORY, {recursive: true});
            const filename = path.join(process.env.RUNNER_TEMP, 'allure-history.zip');
            fs.writeFileSync(filename, Buffer.from(archive.data));
            await exec.exec('unzip', ['-q', filename, '-d', process.env.HISTORY_DIRECTORY]);
      - name: Unit, integration, E2E and recovery
        run: make test-all
      - name: Preserve reports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/lab2/${{ env.RUN_ID }}/
            !artifacts/lab2/${{ env.RUN_ID }}/baseline.dump
            !artifacts/lab2/${{ env.RUN_ID }}/baseline.sql
            !artifacts/lab2/${{ env.RUN_ID }}/restored.sql
      - name: Preserve branch history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-history-${{ steps.history.outputs.key }}
          retention-days: 30
          if-no-files-found: warn
          path: ${{ steps.history.outputs.directory }}/
