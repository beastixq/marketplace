name: Run one test stage
description: Prepare tools, run one isolated stage and preserve its original results
inputs:
  stage:
    description: unit, integration or e2e
    required: true
runs:
  using: composite
  steps:
    - name: Identify runner image and stage
      id: image
      shell: bash
      env:
        TEST_STAGE: ${{ inputs.stage }}
      run: |
        case "$TEST_STAGE" in unit|integration|e2e) ;; *) exit 1 ;; esac
        echo "RUN_ID=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TEST_STAGE}" >> "$GITHUB_ENV"
        echo "TEST_RUNTIME_ROOT=$RUNNER_TEMP/marketplace-testing" >> "$GITHUB_ENV"
        echo "tag=$(python3 -c 'from scripts.testing.controller import runner_image; print(runner_image())')" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - name: Build cached test tools
      uses: docker/build-push-action@v6
      with:
        context: .
        file: tests/Dockerfile
        tags: ${{ steps.image.outputs.tag }}
        load: true
        cache-from: type=gha,scope=marketplace-test-tools
        cache-to: type=gha,scope=marketplace-test-tools,mode=max
    - name: Install Goose CLI
      if: inputs.stage != 'unit'
      shell: bash
      run: |
        directory="$RUNNER_TEMP/goose-cli"
        release="https://github.com/pressly/goose/releases/download/v3.26.0"
        mkdir -p "$directory"
        curl --fail --location --retry 3 "$release/goose_linux_x86_64" -o "$directory/goose_linux_x86_64"
        curl --fail --location --retry 3 "$release/checksums.txt" -o "$directory/checksums.txt"
        cd "$directory"
        awk '$2 == "goose_linux_x86_64" {print}' checksums.txt | sha256sum --check --strict -
        mv goose_linux_x86_64 goose
        chmod +x goose
        echo "$directory" >> "$GITHUB_PATH"
        ./goose -version
    - name: Run tests and recover storage
      shell: bash
      env:
        TEST_STAGE: ${{ inputs.stage }}
      run: make "test-${TEST_STAGE}-isolated"
    - name: Preserve preparation failure if tests did not start
      if: always()
      shell: bash
      run: |
        directory="artifacts/lab2/$RUN_ID"
        if [ ! -d "$directory" ]; then
          mkdir -p "$directory"
          printf 'Test setup did not reach the stage controller; inspect the job logs.\n' > "$directory/preparation.log"
        fi
    - name: Preserve stage diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: testing-${{ inputs.stage }}
        overwrite: true
        retention-days: 14
        if-no-files-found: error
        path: |
          artifacts/lab2/${{ env.RUN_ID }}/
          !artifacts/lab2/${{ env.RUN_ID }}/baseline.dump
          !artifacts/lab2/${{ env.RUN_ID }}/baseline.sql
          !artifacts/lab2/${{ env.RUN_ID }}/restored.sql
